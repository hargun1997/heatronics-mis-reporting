# Month-end reports, pulled and saved by themselves. Once a day from the 3rd of the month (IST) the MIS pulls every
# connected automatic close slot for LAST month (Amazon settlement, Amazon Ads, Meta, Google Ads, Shiprocket, Delhivery,
# Easebuzz, Shopify, BOM pricing, Trial Balance) plus a few earlier open months that still miss one, and saves only clean
# pulls: the same rule and the same commit as "Pull & save all" on Setup (read only against every source).
# The endpoint is an open path like /api/tally/poll: it only starts the once-a-day run and answers counts (no figures);
# the app applies the gate (connectors/slots/autoPull.ts autoPullDue), so the extra runs below are harmless retries.
# No secret needed. Optional repo variable MIS_APP_URL overrides the address.
name: Close slots auto-pull

on:
  schedule:
    - cron: '17 2,5,9 * * *'   # UTC = 07:47, 10:47, 14:47 IST; the app runs once a day, only from the 3rd
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Ask the MIS to pull and save last month's automatic reports
        env:
          APP_URL: ${{ vars.MIS_APP_URL || 'https://heatronics-mis-tool-559416687588.europe-west1.run.app' }}
        run: |
          curl -fsS --retry 1 --retry-delay 30 --max-time 290 \
            -X POST "$APP_URL/api/connectors/auto-pull/run" -H 'Content-Type: application/json' -d '{}'
          echo
